<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.webmanifest"><title>مدیریت کارگاه لیزری دربار</title><style>
:root{--navy:#102a43;--blue:#1d5277;--bg:#f3f6fa;--line:#e0e7ef;--ink:#172b4d;--muted:#687b8e;--green:#13805d;--red:#c2414b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:86px}.top{background:linear-gradient(140deg,var(--navy),var(--blue));color:white;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff20;display:grid;place-items:center;font-size:26px;border:1px solid #ffffff45}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#d6e5f0;margin:0}.toprow{display:flex;justify-content:space-between;align-items:center}.toprow button{background:#ffffff1b;color:white;border:1px solid #ffffff40;border-radius:10px;padding:8px}.today{font-size:12px;color:#dcebf5;margin-top:12px}.content{padding:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}.head h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.panel,.quick{background:white;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:0 5px 18px #102a4308}.metric{display:flex;align-items:center;gap:9px;min-height:88px}.symbol{width:40px;height:40px;display:grid;place-items:center;background:#eaf2f8;border-radius:12px;font-size:20px;flex-shrink:0}.label{font-size:11px;color:var(--muted)}.value{font-size:16px;font-weight:bold;overflow-wrap:anywhere}.green{color:var(--green)}.red{color:var(--red)}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quick{display:flex;align-items:center;gap:9px;text-align:right;min-height:72px;color:var(--ink);font:inherit}.qicon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#e6f6ef;color:var(--green);font-size:20px;flex-shrink:0}.quick strong{display:block;font-size:13px}.quick small{display:block;color:var(--muted);font-size:10px}.quick.out .qicon{background:#fff0ed;color:var(--red)}.btn{background:var(--navy);color:white;border:0;border-radius:11px;padding:9px 12px;font-weight:bold;font:inherit;cursor:pointer}.btn.light{background:#edf2f7;color:var(--ink)}.btn.redbtn{background:#fff0f0;color:var(--red);border:1px solid #ffdada}.btn.sm{font-size:11px;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.search,.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d7e0e9;border-radius:10px;background:white;color:var(--ink);font:inherit}.search{margin-bottom:11px}.field{margin-bottom:11px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:4px}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.span2{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:520px;border-collapse:collapse;background:white}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{background:#f5f8fb;color:#50657a}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.small{font-size:11px}.pill{display:inline-block;background:#edf2f7;border-radius:15px;padding:2px 7px;font-size:10px}.notice{background:#fff7e5;border:1px solid #f2dfad;color:#745516;border-radius:12px;padding:10px;font-size:11px;margin:10px 0}.empty{text-align:center;color:var(--muted);padding:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:5}.navinner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#718096;border-radius:10px;padding:6px 1px;font:10px Tahoma;display:flex;align-items:center;flex-direction:column;gap:1px}.nav b{font-size:18px}.nav .active{background:#eaf2f8;color:var(--navy);font-weight:bold}.modalbg{position:fixed;inset:0;background:#0b1f33a6;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:white;width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h3{margin:0;font-size:17px}.close{border:0;background:#edf2f7;border-radius:10px;width:34px;height:34px;font-size:20px}.hidden{display:none!important}.toast{position:fixed;z-index:30;bottom:85px;right:50%;transform:translateX(50%);background:var(--navy);color:white;border-radius:12px;padding:10px 15px;max-width:90%;font-size:12px}.printhead,.printfoot{display:none}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{background:white;padding:24px;border-radius:20px;max-width:400px;width:100%}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.quickgrid{grid-template-columns:repeat(4,1fr)}.content{padding:20px}.modalbg{align-items:center}}@media(max-width:360px){.content{padding:10px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media print{body{background:white;font-size:10px}.top,.nav,.noprint,.btn,.actions{display:none!important}.app{max-width:none;padding:0}.content{padding:0}.panel,.card{box-shadow:none;border:0}.tablewrap{overflow:visible}table{min-width:0}th,td{font-size:9px;padding:5px}.printhead,.printfoot{display:block}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="root"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),root=$('#root'),KEY='darbar_workshop_v2',SESSION='darbar_login_v2';const defaults={shopName:'مدیریت کارگاه لیزری دربار',phone:'',address:'',currency:'افغانی',logo:'',pinEnabled:false,pin:'',next:{CUS:1,ORD:1,TRX:1,EXP:1,EMP:1,MAT:1}};let db,page='home',q='',modal=null,start='',end='';
const blank=()=>({version:2,settings:{...defaults,next:{...defaults.next}},customers:[],orders:[],transactions:[],expenses:[],employees:[],inventory:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY));if(!db||db.version!==2)db=blank();db.settings={...defaults,...db.settings,next:{...defaults.next,...db.settings?.next}};['customers','orders','transactions','expenses','employees','inventory'].forEach(k=>db[k] ||= [])}catch(e){db=blank()}save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('ذخیره‌سازی ناکام شد؛ از معلومات پشتیبان بگیرید.')}}
function dig(s){return String(s??'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))}
function n(x){let v=Number(dig(String(x??'').replace(/[,\s٬]/g,'')));return Number.isFinite(v)?v:0}function money(x){return n(x).toLocaleString('en-US',{maximumFractionDigits:2})+' '+db.settings.currency}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(t){let x=db.settings.next[t]||1;db.settings.next[t]=x+1;return t+'-'+String(x).padStart(4,'0')}
function iso(){return new Date().toISOString().slice(0,10)}function faDate(d){if(!d)return'—';try{return new Intl.DateTimeFormat('fa-AF-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d+'T12:00:00'))}catch(e){return d}}function today(){return faDate(iso())}
function toast(s){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.append(t)}t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function logged(){return sessionStorage.getItem(SESSION)==='ok'}
function login(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="symbol">د</div><h2>${esc(db.settings.shopName)}</h2><p class="muted">رمز ورود را وارد کنید.</p><form id="login"><div class="field"><label>رمز</label><input name="pin" type="password" required inputmode="numeric"></div><button class="btn">ورود</button></form></div></div>`;$('#login').onsubmit=e=>{e.preventDefault();if(dig(new FormData(e.target).get('pin'))===db.settings.pin){sessionStorage.setItem(SESSION,'ok');render()}else toast('رمز نادرست است')}}
const navs=[['home','⌂','خانه'],['orders','▤','سفارشات'],['customers','♙','مشتریان'],['transactions','⇄','عواید/پرداخت'],['more','☰','بخش‌ها']];
function header(){return `<header class="top"><div class="toprow"><div class="brand"><div class="logo">${db.settings.logo?`<img src="${db.settings.logo}" style="width:100%;height:100%;object-fit:contain">`:'د'}</div><div><h1>${esc(db.settings.shopName)}</h1><p>سامانهٔ مدیریت حساب‌ها و سفارشات</p></div></div><div><button data-action="settings">⚙</button> <button data-action="lock">⌑</button></div></div><div class="today">امروز: ${today()}　 ${esc(db.settings.phone)}</div></header>`}
function nav(){return `<nav class="nav noprint"><div class="navinner">${navs.map(([p,i,t])=>`<button data-go="${p}" class="${page===p||(['expenses','reports','settings','employees','inventory'].includes(page)&&p==='more')?'active':''}"><b>${i}</b>${t}</button>`).join('')}</div></nav>`}
function metric(a,b,c,color=''){return `<div class="card metric"><div class="symbol">${c}</div><div><div class="label">${a}</div><div class="value ${color}">${b}</div></div></div>`}
function home(){let inc=sum(db.transactions.filter(t=>t.type==='in'),'amount'),out=sum(db.transactions.filter(t=>t.type==='out'),'amount')+sum(db.expenses,'amount'),due=sum(db.orders,'total')-sum(db.orders,'paid');return `<div class="head"><h2>خلاصهٔ کارگاه</h2><span class="pill">موبایل</span></div><div class="grid">${metric('دریافت‌های ثبت‌شده',money(inc),'↙','green')}${metric('پرداخت و مصارف',money(out),'↗','red')}${metric('باقی‌داری سفارش‌ها',money(Math.max(0,due)),'◷')}${metric('تعداد مشتریان',db.customers.length,'♙')}</div><div class="head" style="margin-top:22px"><h2>ثبت سریع</h2><span class="muted small">با یک لمس</span></div><div class="quickgrid"><button class="quick" data-modal="txn-in"><div class="qicon">＋</div><div><strong>پول آمده</strong><small>ثبت دریافت</small></div></button><button class="quick out" data-modal="txn-out"><div class="qicon">－</div><div><strong>پول داده‌شده</strong><small>ثبت پرداخت</small></div></button><button class="quick" data-modal="order"><div class="qicon">▤</div><div><strong>سفارش جدید</strong><small>ثبت فرمایش</small></div></button><button class="quick" data-modal="expense"><div class="qicon">◈</div><div><strong>مصرف روزمره</strong><small>ثبت مصارف</small></div></button></div><div class="head" style="margin-top:22px"><h2>آخرین سفارش‌ها</h2><button class="btn light" data-go="orders">همه</button></div><div class="panel">${table(db.orders.slice(0,5).map(o=>[o.code,faDate(o.date),o.customerName||o.guestName||'',o.service,money(o.total)]),['شناسه','تاریخ','مشتری','خدمت','مبلغ'])}</div><div class="notice">معلومات در همین مرورگر و دستگاه ذخیره می‌شود. مرتب از تنظیمات نسخهٔ پشتیبان بگیرید.</div>`}
function sum(a,k){return a.reduce((s,x)=>s+n(x[k]),0)}
function table(rows,heads){if(!rows.length)return '<div class="empty">معلوماتی ثبت نشده است.</div>';return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function customerOpts(sel=''){return `<option value="">— انتخاب مشتری (اختیاری) —</option>`+db.customers.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)} · ${c.code}</option>`).join('')}
function orderOpts(sel=''){return `<option value="">— بدون ارتباط با سفارش —</option>`+db.orders.map(o=>`<option value="${o.id}" ${sel===o.id?'selected':''}>${o.code} — ${esc(o.customerName||o.guestName||'مشتری')}</option>`).join('')}
function listPage(type){let conf={
customers:['مشتریان','مشتری','name',['شناسه','نام','شماره','عملیات']],
orders:['سفارشات','سفارش','service',['شناسه','مشتری','خدمت','مبلغ','باقی','عملیات']],
transactions:['عواید و پرداخت‌ها','txn','amount',['شناسه','تاریخ','نوع','شخص','سفارش','مبلغ','عملیات']],
expenses:['مصارف روزمره','مصرف','amount',['شناسه','تاریخ','نوع مصرف','شرح','مبلغ','عملیات']],
employees:['کارمندان','کارمند','name',['شناسه','نام','معاش','شماره','عملیات']],
inventory:['موجودی انبار','قلم','name',['شناسه','نام مواد','مقدار','واحد','عملیات']]
}[type];let arr=db[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));let rows=arr.map(x=>{let act=`<div class="actions"><button class="btn light sm" data-edit="${type}:${x.id}">ویرایش</button><button class="btn redbtn sm" data-del="${type}:${x.id}">حذف</button></div>`;if(type==='customers')return [x.code,esc(x.name),esc(x.phone||'—'),`<button class="btn light sm" data-detail="${x.id}">حساب</button> ${act}`];if(type==='orders')return [x.code,esc(x.customerName||x.guestName||'—'),esc(x.service),money(x.total),money(Math.max(0,n(x.total)-n(x.paid))),act];if(type==='transactions')return [x.code,faDate(x.date),x.type==='in'?'دریافت':'پرداخت',esc(x.personName||'—'),esc(x.orderCode||'—'),money(x.amount),act];if(type==='expenses')return [x.code,faDate(x.date),esc(x.category),esc(x.note||'—'),money(x.amount),act];if(type==='employees')return [x.code,esc(x.name),money(x.salary),esc(x.phone||'—'),act];return [x.code,esc(x.name),esc(x.qty),esc(x.unit||'عدد'),act]});return `<div class="head"><h2>${conf[0]}</h2><button class="btn" data-modal="${conf[1]}">＋ افزودن</button></div><input class="search" id="search" placeholder="جستجو…" value="${esc(q)}"><div class="panel">${table(rows,conf[3])}</div>`}
function more(){return `<div class="head"><h2>بخش‌های کارگاه</h2></div><div class="quickgrid">${[['expenses','◈','مصارف روزمره','برق، مواد و کرایه'],['employees','♙','کارمندان','معاش و معلومات'],['inventory','▦','موجودی انبار','مواد و تعداد'],['reports','▥','گزارش‌ها','بازهٔ تاریخ و چاپ'],['settings','⚙','تنظیمات','نام، لوگو، پشتیبان'],['help','؟','راهنما','آموزش استفاده']].map(x=>`<button class="quick" data-go="${x[0]}"><div class="qicon">${x[1]}</div><div><strong>${x[2]}</strong><small>${x[3]}</small></div></button>`).join('')}</div>`}
function settings(){return `<div class="head"><h2>تنظیمات دائمی</h2></div><div class="panel"><form id="settings"><div class="field"><label>نام برنامه / کارگاه</label><input name="shopName" required value="${esc(db.settings.shopName)}"></div><div class="formgrid"><div class="field"><label>شماره تماس</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>واحد پول</label><select name="currency">${['افغانی','AFN','دالر'].map(x=>`<option ${x===db.settings.currency?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>آدرس</label><input name="address" value="${esc(db.settings.address)}"></div><div class="field span2"><label>لوگو</label><input type="file" id="logo" accept="image/*"></div></div><button class="btn">ذخیره تنظیمات</button></form></div><div class="panel"><h3>پشتیبان و خروجی</h3><div class="actions"><button class="btn" data-action="backup">دریافت نسخهٔ پشتیبان</button><button class="btn light" data-action="restore">بازیابی پشتیبان</button><button class="btn light" data-action="csv">خروجی Excel (CSV)</button><button class="btn light" data-action="print">چاپ / ذخیره PDF</button></div><input type="file" id="restore" class="hidden" accept=".json,application/json"><p class="small muted">پشتیبان آخر: ${esc(db.settings.lastBackup||'هنوز گرفته نشده')}</p></div><div class="panel"><h3>قفل ورود</h3><p class="small muted">این قفل محلی و ساده است؛ امنیت سروری یا رمزنگاری حرفه‌ای فراهم نمی‌کند.</p><form id="pinform"><div class="field"><label>رمز ۴ تا ۱۲ رقمی</label><input name="pin" type="password" inputmode="numeric" minlength="4" maxlength="12"></div><div class="actions"><button class="btn">فعال‌کردن / تغییر رمز</button>${db.settings.pinEnabled?'<button type="button" class="btn redbtn" data-action="disablepin">غیرفعال‌کردن قفل</button>':''}</div></form></div><div class="panel"><h3>مدیریت اطلاعات</h3><button class="btn redbtn" data-action="clear">پاک‌کردن همهٔ معلومات</button></div>`}
function reports(){let a=start||iso().slice(0,8)+'01',b=end||iso(),tx=db.transactions.filter(x=>x.date>=a&&x.date<=b),ex=db.expenses.filter(x=>x.date>=a&&x.date<=b),od=db.orders.filter(x=>x.date>=a&&x.date<=b);return `<div class="head"><h2>گزارش‌ها</h2><button class="btn" data-action="print">چاپ / PDF</button></div><div class="panel"><form id="reportform"><div class="formgrid"><div class="field"><label>از تاریخ</label><input type="date" name="start" value="${a}"></div><div class="field"><label>تا تاریخ</label><input type="date" name="end" value="${b}"></div></div><button class="btn">نمایش گزارش</button></form></div><div class="printhead"><h2>${esc(db.settings.shopName)} — گزارش مالی</h2><p>از ${faDate(a)} تا ${faDate(b)}</p></div><div class="grid">${metric('دریافت',money(sum(tx.filter(x=>x.type==='in'),'amount')),'↙','green')}${metric('پرداخت',money(sum(tx.filter(x=>x.type==='out'),'amount')),'↗','red')}${metric('مصارف',money(sum(ex,'amount')),'◈','red')}${metric('ارزش سفارش‌ها',money(sum(od,'total')),'▤')}</div><div class="panel"><h3>معاملات</h3>${table(tx.map(x=>[faDate(x.date),x.type==='in'?'دریافت':'پرداخت',esc(x.personName||''),esc(x.note||x.orderCode||''),money(x.amount)]),['تاریخ','نوع','شخص','شرح','مبلغ'])}</div><div class="panel"><h3>مصارف</h3>${table(ex.map(x=>[faDate(x.date),esc(x.category),esc(x.note||''),money(x.amount)]),['تاریخ','نوع','شرح','مبلغ'])}</div><div class="panel"><h3>سفارش‌ها</h3>${table(od.map(x=>[faDate(x.date),x.code,esc(x.customerName||x.guestName||''),esc(x.service),money(x.total),money(Math.max(0,n(x.total)-n(x.paid)))]),['تاریخ','شناسه','مشتری','خدمت','مبلغ','باقی'])}</div><div class="printfoot">تهیه‌شده از ${esc(db.settings.shopName)} — ${today()}</div>`}
function help(){return `<div class="head"><h2>راهنمای برنامه</h2></div><div class="panel"><h3>مشتریان</h3><p>مشتری تکراری را یک‌بار ثبت کنید؛ در سفارش و دریافت پول از فهرست انتخاب نمایید. مشتری یک‌باره را در «نام موقت» وارد کنید.</p><h3>سفارشات</h3><p>مبلغ کل، تاریخ، خدمت و مشتری را وارد کنید. پیش‌پرداخت واردشده در سفارش برای محاسبهٔ باقی‌داری است؛ برای سابقهٔ دقیق دریافت، معاملهٔ «پول آمده» نیز ثبت کنید، اما یک مبلغ را دو بار در گزارش نقدی ثبت نکنید.</p><h3>عواید / پرداخت‌ها</h3><p>در ثبت پول آمده یا داده‌شده، مشتری و سفارش مربوط را انتخاب کنید تا سابقه به حساب صحیح وصل شود.</p><h3>پشتیبان</h3><p>در تنظیمات فایل JSON بگیرید و آن را در جای امن نگه دارید. بازیابی پشتیبان، معلومات فعلی را جایگزین می‌کند.</p><h3>PDF و Excel</h3><p>گزارش‌ها را باز کرده و چاپ / PDF را بزنید. CSV با UTF-8 برای بازکردن در Excel صادر می‌شود. خروجی چاپ مرورگر را قبل از استفاده رسمی آزمایش کنید.</p><div class="notice">داده‌ها فقط روی همین دستگاه/مرورگر است و خودکار همگام نمی‌شود. پاک‌کردن داده‌های مرورگر ممکن است معلومات را از بین ببرد.</div></div>`}
function render(){if(db.settings.pinEnabled&&!logged()){login();return}let body=({home,customers:()=>listPage('customers'),orders:()=>listPage('orders'),transactions:()=>listPage('transactions'),expenses:()=>listPage('expenses'),employees:()=>listPage('employees'),inventory:()=>listPage('inventory'),more,settings,reports,help}[page]||home)();root.innerHTML=`<div class="app">${header()}<main class="content">${body}<p class="muted small" style="text-align:center">اطلاعات در همین دستگاه ذخیره می‌شود؛ مرتب نسخهٔ پشتیبان بگیرید.</p></main>${nav()}</div>`;bind();if(modal)showModal(modal)}
function modalHtml(kind,id0=''){let obj=null,edit=kind.startsWith('edit-');if(edit){kind=kind.slice(5);obj=db[{customer:'customers',order:'orders',txn:'transactions',expense:'expenses',employee:'employees',inventory:'inventory'}[kind]]?.find(x=>x.id===id0)}const v=(k,d='')=>esc(obj?.[k]??d),date=v('date',iso());let title='',fields='';
if(kind==='customer'){title=obj?'ویرایش مشتری':'ثبت مشتری';fields=`<div class="field"><label>نام مشتری / فروشگاه *</label><input name="name" required value="${v('name')}"></div><div class="formgrid"><div class="field"><label>شماره</label><input name="phone" value="${v('phone')}"></div><div class="field"><label>آدرس</label><input name="address" value="${v('address')}"></div></div><div class="field"><label>یادداشت</label><textarea name="note">${v('note')}</textarea></div>`}
if(kind==='order'){title=obj?'ویرایش سفارش':'سفارش جدید';fields=`<div class="field"><label>مشتری ثبت‌شده</label><select name="customerId">${customerOpts(v('customerId'))}</select></div><div class="field"><label>نام مشتری یک‌باره</label><input name="guestName" value="${v('guestName')}" placeholder="در صورت نبودن در فهرست"></div><div class="field"><label>خدمت / محصول *</label><input name="service" required value="${v('service')}"></div><div class="formgrid"><div class="field"><label>تعداد</label><input name="qty" inputmode="decimal" value="${v('qty','1')}"></div><div class="field"><label>قیمت فی‌واحد</label><input name="unitPrice" inputmode="decimal" value="${v('unitPrice')}"></div><div class="field"><label>مبلغ کل *</label><input name="total" required inputmode="decimal" value="${v('total')}"></div><div class="field"><label>پیش‌پرداخت</label><input name="paid" inputmode="decimal" value="${v('paid','0')}"></div><div class="field"><label>تاریخ</label><input name="date" type="date" required value="${date}"></div><div class="field"><label>تاریخ تحویل</label><input name="deliveryDate" type="date" value="${v('deliveryDate')}"></div><div class="field span2"><label>وضعیت</label><select name="status">${['ثبت‌شده','در طراحی','در تولید','تکمیل‌شده','تحویل‌شده','لغوشده'].map(x=>`<option ${v('status','ثبت‌شده')===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>توضیحات</label><textarea name="note">${v('note')}</textarea></div><div class="notice">پیش‌پرداخت اینجا باقی‌داری سفارش را محاسبه می‌کند. برای ثبت سابقهٔ دریافت پول، از بخش پول آمده استفاده کنید؛ یک مبلغ را دوبار به‌عنوان دریافت ثبت نکنید.</div>`}
if(kind==='txn'){let type=obj?.type||(modal==='txn-out'?'out':'in');title=obj?'ویرایش معامله':type==='in'?'ثبت پول آمده':'ثبت پول داده‌شده';fields=`<input type="hidden" name="type" value="${type}"><div class="field"><label>مشتری ثبت‌شده</label><select name="customerId">${customerOpts(v('customerId'))}</select></div><div class="field"><label>نام موقت شخص / شرکت</label><input name="guestName" value="${v('guestName')}"></div><div class="field"><label>سفارش مربوط</label><select name="orderId">${orderOpts(v('orderId'))}</select></div><div class="formgrid"><div class="field"><label>مبلغ *</label><input name="amount" required inputmode="decimal" value="${v('amount')}"></div><div class="field"><label>تاریخ *</label><input name="date" type="date" required value="${date}"></div><div class="field"><label>دسته‌بندی</label><select name="category">${['دریافت بابت سفارش','عاید خدمات','پرداخت به شخص','خرید مواد','معاش','سایر'].map(x=>`<option ${v('category',type==='in'?'دریافت بابت سفارش':'سایر')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>روش</label><select name="method">${['نقدی','انتقال','حواله','سایر'].map(x=>`<option ${v('method','نقدی')===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>توضیحات</label><textarea name="note">${v('note')}</textarea></div>`}
if(kind==='expense'){title=obj?'ویرایش مصرف':'ثبت مصرف روزمره';fields=`<div class="formgrid"><div class="field"><label>نوع مصرف</label><select name="category">${['مواد اولیه','برق','کرایه','معاش','ترانسپورت','تعمیرات','مخابرات','سایر'].map(x=>`<option ${v('category','مواد اولیه')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>مبلغ *</label><input name="amount" required inputmode="decimal" value="${v('amount')}"></div><div class="field"><label>تاریخ</label><input name="date" type="date" required value="${date}"></div><div class="field"><label>پرداخت به</label><select name="customerId">${customerOpts(v('customerId'))}</select></div></div><div class="field"><label>شرح</label><textarea name="note">${v('note')}</textarea></div>`}
if(kind==='employee'){title=obj?'ویرایش کارمند':'ثبت کارمند';fields=`<div class="field"><label>نام *</label><input name="name" required value="${v('name')}"></div><div class="formgrid"><div class="field"><label>شماره</label><input name="phone" value="${v('phone')}"></div><div class="field"><label>معاش ماهانه</label><input name="salary" inputmode="decimal" value="${v('salary','0')}"></div></div><div class="field"><label>یادداشت</label><textarea name="note">${v('note')}</textarea></div>`}
if(kind==='inventory'){title=obj?'ویرایش قلم':'افزودن قلم انبار';fields=`<div class="field"><label>نام مواد *</label><input name="name" required value="${v('name')}"></div><div class="formgrid"><div class="field"><label>مقدار</label><input name="qty" inputmode="decimal" value="${v('qty','0')}"></div><div class="field"><label>واحد</label><input name="unit" value="${v('unit','عدد')}"></div></div><div class="field"><label>یادداشت</label><textarea name="note">${v('note')}</textarea></div>`}
return `<div class="modalbg" id="modalbg"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="close" data-action="close">×</button></div><form id="rec" data-kind="${kind}" data-id="${obj?.id||''}">${fields}<div class="actions"><button class="btn">ذخیره</button><button type="button" class="btn light" data-action="close">انصراف</button></div></form></div></div>`}
function showModal(k,id0=''){modal=k;$('#modalbg')?.remove();document.body.insertAdjacentHTML('beforeend',modalHtml(k,id0));let f=$('#rec');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries()),kind=f.dataset.kind,oldid=f.dataset.id;['amount','total','paid','qty','unitPrice','salary'].forEach(k=>{if(k in d)d[k]=n(d[k])});let customer=db.customers.find(c=>c.id===d.customerId);if(d.customerId){d.personName=customer?.name||'';d.customerName=customer?.name||''}else{d.personName=(d.guestName||'').trim();d.customerName=''}let order=db.orders.find(o=>o.id===d.orderId);if(order){d.orderCode=order.code;if(!d.personName)d.personName=order.customerName||order.guestName||''}let key={customer:'customers',order:'orders',txn:'transactions',expense:'expenses',employee:'employees',inventory:'inventory'}[kind],arr=db[key];if(kind==='order'&&(!d.total||d.total<0)){toast('مبلغ کل معتبر وارد کنید');return}if(['txn','expense'].includes(kind)&&(!d.amount||d.amount<=0)){toast('مبلغ باید بیشتر از صفر باشد');return}let code=oldid?arr.find(x=>x.id===oldid)?.code:id(({customer:'CUS',order:'ORD',txn:'TRX',expense:'EXP',employee:'EMP',inventory:'MAT'})[kind]);let rec={...d,id:oldid||code,code};if(kind==='txn'&&d.type==='in'&&order){rec.orderCode=order.code}if(oldid){let ix=arr.findIndex(x=>x.id===oldid);arr[ix]={...arr[ix],...rec}}else arr.unshift(rec);if(kind==='customer')rec.code=rec.code||id('CUS');save();modal=null;$('#modalbg').remove();render();toast('معلومات ذخیره شد')}}
function bind(){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;q='';modal=null;render()});root.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>showModal(b.dataset.modal));root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));let s=$('#search');if(s)s.oninput=()=>{q=s.value;render();$('#search')?.focus()};root.querySelectorAll('[data-edit]').forEach(b=>{let [t,id0]=b.dataset.edit.split(':');b.onclick=()=>showModal('edit-'+({customers:'customer',orders:'order',transactions:'txn',expenses:'expense',employees:'employee',inventory:'inventory'}[t]),id0)});root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let [t,id0]=b.dataset.del.split(':');if(confirm('از حذف این مورد مطمئن هستید؟')){db[t]=db[t].filter(x=>x.id!==id0);save();render()}});root.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));let sf=$('#settings');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf).entries());Object.assign(db.settings,{shopName:d.shopName,phone:d.phone,address:d.address,currency:d.currency});save();render();toast('تنظیمات ذخیره شد')};let lf=$('#logo');if(lf)lf.onchange=()=>{let f=lf.files[0];if(!f)return;if(f.size>700000){toast('لوگوی کوچک‌تر انتخاب کنید');return}let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();render()};r.readAsDataURL(f)};let pf=$('#pinform');if(pf)pf.onsubmit=e=>{e.preventDefault();let p=dig(new FormData(pf).get('pin'));if(!/^\d{4,12}$/.test(p)){toast('رمز باید ۴ تا ۱۲ رقم باشد');return}db.settings.pin=p;db.settings.pinEnabled=true;sessionStorage.setItem(SESSION,'ok');save();render();toast('قفل فعال شد')};let rf=$('#reportform');if(rf)rf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(rf).entries());if(d.start>d.end){toast('بازه تاریخ درست نیست');return}start=d.start;end=d.end;render()}}
function detail(id0){let c=db.customers.find(x=>x.id===id0);if(!c)return;let orders=db.orders.filter(o=>o.customerId===id0),tx=db.transactions.filter(t=>t.customerId===id0);let content=`<div class="modalhead"><h3>حساب مشتری: ${esc(c.name)}</h3><button class="close" data-action="close">×</button></div><div class="grid">${metric('مجموع سفارش‌ها',money(sum(orders,'total')),'▤')}${metric('باقی سفارش‌ها',money(orders.reduce((s,o)=>s+Math.max(0,n(o.total)-n(o.paid)),0)),'◷','red')}${metric('دریافت‌ها',money(sum(tx.filter(t=>t.type==='in'),'amount')),'↙','green')}${metric('پرداخت‌ها',money(sum(tx.filter(t=>t.type==='out'),'amount')),'↗','red')}</div><h3>سفارش‌ها</h3>${table(orders.map(o=>[o.code,faDate(o.date),esc(o.service),money(o.total),money(Math.max(0,n(o.total)-n(o.paid)))]),['شناسه','تاریخ','خدمت','مبلغ','باقی'])}<h3>معاملات</h3>${table(tx.map(t=>[faDate(t.date),t.type==='in'?'دریافت':'پرداخت',t.code,esc(t.note||''),money(t.amount)]),['تاریخ','نوع','شناسه','شرح','مبلغ'])}`;$('#modalbg')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modalbg"><div class="modal">${content}</div></div>`);$('#modalbg [data-action=close]').onclick=()=>$('#modalbg').remove()}
function action(a){if(a==='settings'){page='settings';render()}if(a==='close'){$('#modalbg')?.remove();modal=null}if(a==='lock'){sessionStorage.removeItem(SESSION);if(db.settings.pinEnabled)render();else toast('برای قفل، از تنظیمات رمز تعیین کنید')}if(a==='help'){page='help';render()}if(a==='print')window.print();if(a==='backup'){db.settings.lastBackup=today();save();download(JSON.stringify(db,null,2),'darbar-backup-'+iso()+'.json','application/json;charset=utf-8');render()}if(a==='restore')$('#restore')?.click();if(a==='csv'){let rows=[['بخش','شناسه','تاریخ شمسی','نوع','شخص','شرح','مبلغ','باقی']];db.transactions.forEach(x=>rows.push(['معامله',x.code,faDate(x.date),x.type==='in'?'دریافت':'پرداخت',x.personName,x.note,x.amount,'']));db.expenses.forEach(x=>rows.push(['مصرف',x.code,faDate(x.date),x.category,'',x.note,x.amount,'']));db.orders.forEach(x=>rows.push(['سفارش',x.code,faDate(x.date),x.service,x.customerName||x.guestName,x.status,x.total,Math.max(0,n(x.total)-n(x.paid))]));db.customers.forEach(x=>rows.push(['مشتری',x.code,'','',x.name,x.phone,'','']));download('\\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n'),'darbar-report-'+iso()+'.csv','text/csv;charset=utf-8');toast('فایل CSV آماده شد')}if(a==='disablepin'&&confirm('قفل غیرفعال شود؟')){db.settings.pinEnabled=false;db.settings.pin='';save();render()}if(a==='clear'&&confirm('تمام اطلاعات پاک شود؟ ابتدا نسخه پشتیبان بگیرید.')&&confirm('این عمل برگشت‌ناپذیر است؛ ادامه؟')){db=blank();save();page='home';render()}}
function download(txt,name,type){let b=new Blob([txt],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
const restore=document.createElement('input');restore.type='file';restore.accept='.json,application/json';restore.className='hidden';document.body.append(restore);restore.onchange=()=>{let f=restore.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.version!==2||!Array.isArray(d.customers)||!Array.isArray(d.orders))throw 0;if(confirm('نسخهٔ پشتیبان جایگزین معلومات فعلی می‌شود. ادامه؟')){db=d;db.settings={...defaults,...db.settings,next:{...defaults.next,...db.settings?.next}};save();render();toast('بازیابی شد')}}catch(e){toast('فایل پشتیبان معتبر نیست')}restore.value=''};r.readAsText(f)};document.addEventListener('click',e=>{if(e.target.id==='modalbg'){e.target.remove();modal=null}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&db.settings.pinEnabled)sessionStorage.removeItem(SESSION)});load();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
